/**:
  ros__parameters:
    robot_base_frame: base_link
    return_to_init: true
    auto_start: false
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 1.0
    progress_timeout: 20.0
    potential_scale: 10.0
    orientation_scale: 6.0
    gain_scale: 5.0
    obstacle_penalty_scale: 2.0
    transform_tolerance: 0.3
    min_frontier_size: 0.25
    min_frontier_clearance: 1.0
    no_frontier_retry: 3
    battery_topic: /battery_state
    energy_per_meter: 0.000185  # fraction of battery (0-1 scale) per meter; derived from
                                # Husky A200 specs: 24V 20Ah, ~3hr runtime at 0.5 m/s nav speed
    battery_safety_margin: 0.1
    battery_penalty_scale: 1.0
    max_battery_used: 0.8
    max_radiation_dose: 100.0
    # There is no critical_dose_mrem_hr here: it no longer gated anything and
    # has been removed. The frontier point-lethality ceiling tracks the
    # effective acute threshold, and affordability is decided by the
    # transit-dose gate (frontier_dose_spend_fraction).
    acute_dose_rate_mrem_hr: 10.0
    dose_budget_scale: 10.0
    # Max fraction of the remaining dose budget one frontier visit (round
    # trip at the predicted centroid dose rate) may cost; relaxed by
    # dose_budget_relaxation_k like the thresholds.
    frontier_dose_spend_fraction: 0.05
    # How long to hold mission completion while every remaining frontier is
    # gated (dose/battery infeasible), giving the GP estimate time to refine,
    # before conceding and completing with foreclosed area unexplored.
    all_gated_completion_timeout_s: 180.0
    safe_dose_threshold_mrem_hr: 1.0
    radiation_topic: rad
    heatmap_topic: /rad_heatmap/raw_mean_map
    radiation_scale: 1.0
    radiation_gradient_scale: 1.0
    min_goal_distance_for_replanning: 0.75
